services:

  # Triton Inference Server (for multi-stream optimization)
  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: triton_inference_server
    runtime: nvidia
    networks:
      - kafka_default
      - redis_default
    ports:
      - "8100:8100"
      - "8101:8101"
      - "8102:8102"
    volumes:
      - ../triton_model_repository:/models:ro
      - ../logs/triton:/logs
    environment:
      - CUDA_VISIBLE_DEVICES=0  # Can use 0,1,2,3 for multi-GPU
      - TRT_LOGGER_LEVEL=WARNING
    command: >
      tritonserver
      --model-repository=/models
      --strict-model-config=false
      --http-port=8100
      --grpc-port=8101
      --metrics-port=8102
      --log-verbose=1
      --log-info=true
      --log-warning=true
      --log-error=true
      --exit-on-error=false
      --model-control-mode=poll
      --repository-poll-secs=30
    restart: unless-stopped
    shm_size: '8gb'  # Increased from 4GB for multi-instance support
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # UI Service (Streamlit)
  ui:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ui
    container_name: person_reid_ui
    networks:
      - kafka_default
      - redis_default
    ports:
      - "8501:8501"
    volumes:
      - ../outputs:/app/outputs
      - ../data:/app/data
      - ../logs:/app/logs
      - ../configs:/app/configs
      - ../models:/app/models
    env_file:
      - ../configs/.env
    restart: unless-stopped
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Register Service (GPU Processing)
  register:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.register
    container_name: person_reid_register
    runtime: nvidia
    networks:
      - kafka_default
      - redis_default
    ports:
      - "8002:8002"
    volumes:
      - ../outputs:/app/outputs
      - ../data:/app/data
      - ../logs:/app/logs
      - ../configs:/app/configs
      - ../models:/app/models
    env_file:
      - ../configs/.env
    restart: unless-stopped
    shm_size: '4gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 7s
      retries: 3
      start_period: 30s

  # Detection Service (GPU Processing)
  detection:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.detection
    container_name: person_reid_detection
    runtime: nvidia
    networks:
      - kafka_default
      - redis_default
    ports:
      - "8003:8003"
      - "1900-1920:1900-1920/udp"
    volumes:
      - ../outputs:/app/outputs
      - ../data:/app/data
      - ../logs:/app/logs
      - ../configs:/app/configs
      - ../models:/app/models
      - ../triton_model_repository:/app/triton_model_repository:ro
    env_file:
      - ../configs/.env
    restart: unless-stopped
    shm_size: '8gb'
    depends_on:
      triton:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 60s
      timeout: 7s
      retries: 3
      start_period: 30s

  # Kafka Consumer Service (for UI alerts)
  kafka_consumer:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.kafka_consumer
    container_name: person_reid_kafka_consumer
    networks:
      - kafka_default
      - redis_default
    ports:
      - "8004:8004"
    volumes:
      - ../logs:/app/logs
      - ../configs:/app/configs
    env_file:
      - ../configs/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Livestream Service (HLS streaming for real-time AI output)
  livestream:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.livestream
    container_name: person_reid_livestream
    networks:
      - kafka_default
      - redis_default
    ports:
      - "3900:3900"
    volumes:
      - ../outputs:/app/outputs
      - ../services:/app/services
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3900/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Volumes for persistent storage
volumes:
  redis_data:
    driver: local

# External networks for Kafka and Redis
networks:
  kafka_default:
    external: true
  redis_default:
    external: true