# Zone Configuration
# Unified format for single and multi-camera setups with dual monitoring modes

cameras:
  camera_1:
    name: "Camera 1 - Main Entrance"
    stream_url: "udp://127.0.0.1:1905"
    zones:
      zone1:
        name: "Assembly Area"
        polygon:
          - [100, 100]
          - [400, 100]
          - [400, 300]
          - [100, 300]
        required_count: 3  # MODE 1: Need at least 3 people (any identity)
        required_persons: [1]  # MODE 2: Need Duong (ID: 1)
      
      zone2:
        name: "Packaging Area"
        polygon:
          - [450, 100]
          - [750, 100]
          - [750, 300]
          - [450, 300]
        required_count: 2
        required_persons: [2]  # Khiem (ID: 2)
      
      zone3:
        name: "Common Area"
        polygon:
          - [100, 350]
          - [750, 350]
          - [750, 500]
          - [100, 500]
        required_count: 1
        required_persons: [1, 2]

# Monitoring Modes:
# MODE 1 - People Counting (reid.enable = false):
#   - Uses: required_count
#   - Checks: Total number of people in zone
#   - Alert: "Zone X incomplete: Need 3 people, found 2"
#
# MODE 2 - Identity Verification (reid.enable = true):
#   - Uses: required_persons
#   - Checks: Specific person IDs must be present
#   - Alert: "Zone X incomplete: Missing Person 2 (KHIEM_2)"
